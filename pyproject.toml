[project]
name = "uc-intg-psn"
version = "3.0.1"
description = "UC Integration for PlayStation Network"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pyee>=12,<13",
    "ucapi==0.7.0",
    "PSNAWP==3.0.3",
    "pyrate_limiter>=4.0.2,<5.0.0",
    "aiohttp>=3.13.2",
    "ucapi-framework==1.9.8",
    "packaging>=25.0",
    "playdirector==0.4.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
 "pytest-asyncio>=0.24",
 "pytest-cov>=7.1.0",
 "ruff>=0.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["intg-psn"]
