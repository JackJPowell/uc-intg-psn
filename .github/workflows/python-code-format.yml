name: Check Python code formatting

on:
  push:
    paths:
      - 'intg-psn/**'
      - 'uv.lock'
      - '.python-version'
      - 'tools/**'
      - 'tests/**'
      - '.github/**/*.yml'
      - '.pylintrc'
      - 'pyproject.toml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-24.04

    name: Check Python code formatting
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: '0.13.10'
          enable-cache: true

      - name: Lint and format with Ruff
        run: |
          uv run ruff check intg-psn
          uv run ruff format intg-psn --check
          uv run pytest tests
