# Triggered by version tag creation to build a distribution binary, Docker image, and create a release draft
name: "Build & Release"

"on":
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.2.0, without v prefix)"
        required: true
        type: string

env:
  INTG_NAME: psn
  # Python version to use in the builder image. See https://hub.docker.com/r/unfoldedcircle/r2-pyinstaller for possible versions.
  PYTHON_VER: 3.11.13-0.7.0

jobs:
  build:
    name: Build Release
    runs-on: ubuntu-24.04
    #Save version to env output variable to be able to use it in the following release job as a tag
    outputs:
      version: ${{ steps.get-version-and-id.outputs.VERSION }}
      driver_id: ${{ steps.get-version-and-id.outputs.DRIVER_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # History of 200 should be more than enough to calculate commit count since last release tag
          fetch-depth: 200

      - name: Get version and id
        #Id needed for env output variable
        id: get-version-and-id
        run: |
          # Use manual input version when triggered via workflow_dispatch, otherwise extract from git tag
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION=${{ github.event.inputs.version }}
          else
            VERSION=${GITHUB_REF#refs/tags/v}
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "DRIVER_ID=$(jq .driver_id -r driver.json)" >> $GITHUB_ENV
          # Save to Github output to later use it in Create Release job
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "DRIVER_ID=$(jq .driver_id -r driver.json)" >> $GITHUB_OUTPUT

      - name: Build
        run: |
          sudo apt-get update && sudo apt-get install -y qemu-system-arm binfmt-support qemu-user-static
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
          echo "Starting pyinstaller build"
          docker run --rm --name builder \
            --platform=aarch64 \
            --user=$(id -u):$(id -g) \
            -v ${GITHUB_WORKSPACE}:/workspace \
            docker.io/unfoldedcircle/r2-pyinstaller:${PYTHON_VER} \
            bash -c \
            "cd /workspace && \
              python -m pip install -r requirements.txt && \
              python -m pip check && \
              pyinstaller --clean --onedir --name intg-${DRIVER_ID} --collect-all zeroconf --collect-all playdirector --hidden-import pyremoteplay.takion_pb2 --collect-binaries Cryptodome --exclude-module pyremoteplay.gui --exclude-module pyremoteplay.gamepad intg-${INTG_NAME}/driver.py"

      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p artifacts/bin
          mv dist/intg-${{ env.DRIVER_ID }}/* artifacts/bin
          mv artifacts/bin/intg-${{ env.DRIVER_ID }} artifacts/bin/driver
          cp driver.json artifacts/
          python3 -m pip download --no-deps --no-binary=:all: --dest artifacts/sources playdirector==0.4.0
          python3 tools/package_sources.py artifacts --library-source artifacts/sources/playdirector-0.4.0.tar.gz
          echo "ARTIFACT_NAME=uc-intg-${{ env.DRIVER_ID }}-${{ env.VERSION }}-aarch64" >> $GITHUB_ENV
          
      - name: Create upload artifact archive
        shell: bash
        run: | 
          tar czvf ${{ env.ARTIFACT_NAME }}.tar.gz -C ${GITHUB_WORKSPACE}/artifacts .
          ls -lah
          
      - uses: actions/upload-artifact@v7
        id: upload_artifact
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_NAME }}.tar.gz
          if-no-files-found: error
          retention-days: 3
            
  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-24.04
    needs: [build]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/uc-intg-${{ env.INTG_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=${{ needs.build.outputs.version }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
            
  release:
    name: Create Release
    runs-on: ubuntu-24.04
    needs: [build, docker]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION=${{ needs.build.outputs.version }}
          # Extract the block between this version's heading and the next heading
          NOTES=$(awk "/^## v?${VERSION}/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md)
          # Strip leading/trailing blank lines
          NOTES=$(echo "$NOTES" | sed '/./,$!d' | sed -e :a -e '/^\s*$/{$d;N;ba}')
          if [ -z "$NOTES" ]; then
            NOTES="See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details."
          fi
          # Write to file to safely handle multi-line content
          echo "$NOTES" > release_notes.md
          cat release_notes.md

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: uc-intg-${{ needs.build.outputs.driver_id }}-${{ needs.build.outputs.version }}-*
          path: release-artifacts
          merge-multiple: true

      - name: Create hash file
        shell: bash
        working-directory: release-artifacts
        env:
          DRIVER_ID: ${{ needs.build.outputs.driver_id }}
        run: |
          shopt -s nullglob
          archives=(*.tar.gz)
          if (( ${#archives[@]} == 0 )); then
            echo "::error::No release archives were downloaded"
            exit 1
          fi
          for filename in "${archives[@]}"; do
            printf 'sha256  %s\n' "$(sha256sum "$filename")"
          done > "$DRIVER_ID.hash"

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "release-artifacts/*.tar.gz,release-artifacts/${{needs.build.outputs.driver_id}}.hash"
          draft: false
          bodyFile: release_notes.md
          generateReleaseNotes: false
          artifactErrorsFailBuild: true
          tag: v${{needs.build.outputs.version}}
