# Build a distribution binary and Docker image, then publish the release.
name: "Build & Release"

"on":
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.2.0, without v prefix)"
        required: true
        type: string

env:
  INTG_NAME: psn

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build Release
    # glibc 2.35 build baseline for devices with glibc 2.38.
    runs-on: ubuntu-22.04-arm
    #Save version to env output variable to be able to use it in the following release job as a tag
    outputs:
      version: ${{ steps.get-version-and-id.outputs.VERSION }}
      driver_id: ${{ steps.get-version-and-id.outputs.DRIVER_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: '0.13.10'
          enable-cache: true

      - name: Get version and id
        id: get-version-and-id
        env:
          RELEASE_INPUT_VERSION: ${{ inputs.version }}
        run: &release-metadata |
          set -euo pipefail

          VERSION=${RELEASE_INPUT_VERSION:-${GITHUB_REF#refs/tags/v}}

          # Keep values safe for filenames, image tags, and GitHub's environment files.
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][[:alnum:].-]+)?$ ]] || {
            echo "Invalid release version: $VERSION" >&2
            exit 1
          }
          METADATA=$(jq -er '[.driver_id, .version] | @tsv' driver.json)
          IFS=$'\t' read -r DRIVER_ID DRIVER_VERSION <<< "$METADATA"
          [[ "$DRIVER_ID" =~ ^[[:alnum:]_-]+$ ]]
          PROJECT_VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [[ "$VERSION" != "$DRIVER_VERSION" || "$VERSION" != "$PROJECT_VERSION" ]]; then
            echo "Release ($VERSION), driver.json ($DRIVER_VERSION), and pyproject.toml ($PROJECT_VERSION) must match." >&2
            exit 1
          fi

          printf 'VERSION=%s\nDRIVER_ID=%s\n' "$VERSION" "$DRIVER_ID" | tee -a "$GITHUB_ENV" "$GITHUB_OUTPUT"

      - name: Build
        run: |
          uv run --no-dev --group build pyinstaller --clean --onedir \
            --name "intg-${DRIVER_ID}" \
            --collect-all zeroconf \
            --collect-all playdirector \
            --hidden-import pyremoteplay.takion_pb2 \
            --collect-binaries Cryptodome \
            --exclude-module pyremoteplay.gui \
            --exclude-module pyremoteplay.gamepad \
            "intg-${INTG_NAME}/driver.py"

      - name: Package release archive
        run: |
          mkdir -p artifacts/bin
          cp -a "dist/intg-${DRIVER_ID}/." artifacts/bin/
          mv "artifacts/bin/intg-${DRIVER_ID}" artifacts/bin/driver
          cp driver.json artifacts/
          uv run --no-dev python tools/package_sources.py artifacts
          ARTIFACT_NAME="uc-intg-${DRIVER_ID}-${VERSION}-aarch64"
          tar czf "${ARTIFACT_NAME}.tar.gz" -C artifacts .
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_NAME }}.tar.gz
          if-no-files-found: error
          retention-days: 3

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get version and id
        env:
          RELEASE_INPUT_VERSION: ${{ inputs.version }}
        run: *release-metadata

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/uc-intg-${{ env.INTG_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=${{ env.VERSION }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: Create Release
    runs-on: ubuntu-24.04
    needs: [build, docker]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract changelog for this version
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # Extract the block between this version's heading and the next heading
          NOTES=$(awk "/^## v?${VERSION}/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md)
          # Strip leading/trailing blank lines
          NOTES=$(echo "$NOTES" | sed '/./,$!d' | sed -e :a -e '/^\s*$/{$d;N;ba}')
          if [ -z "$NOTES" ]; then
            NOTES="See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details."
          fi
          # Write to file to safely handle multi-line content
          echo "$NOTES" > release_notes.md
          cat release_notes.md

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: uc-intg-${{ needs.build.outputs.driver_id }}-${{ needs.build.outputs.version }}-*
          path: release-artifacts
          merge-multiple: true

      - name: Create hash file
        working-directory: release-artifacts
        env:
          DRIVER_ID: ${{ needs.build.outputs.driver_id }}
        run: |
          sha256sum -- *.tar.gz | sed 's/^/sha256  /' > "${DRIVER_ID}.hash"

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "release-artifacts/*.tar.gz,release-artifacts/${{needs.build.outputs.driver_id}}.hash"
          draft: false
          bodyFile: release_notes.md
          generateReleaseNotes: false
          artifactErrorsFailBuild: true
          tag: v${{needs.build.outputs.version}}
